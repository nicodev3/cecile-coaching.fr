			try {
				data = typeof raw === 'string' ? JSON.parse(raw) : raw;
			} catch (e) {}
			var answers = data && (data.answers || data.reponses);
			for (var q = 0; q < QUESTION_IDS.length; q++) {
				var value = null;
				if (Array.isArray(answers)) {
					value = answers[q];
					for (var i = 0; i < answers.length; i++) {
						if (answers[i] && answers[i].id === QUESTION_IDS[q]) value = answers[i];
					}
				} else if (answers && typeof answers === 'object') {
					value = answers[QUESTION_IDS[q]];
					if (value == null) value = answers['q' + (q + 1)];
				}
				out.push(value == null ? null : parseAnswer(q, value));
			}
			return { data: data, answers: out };
		}

		/** Barème RE-FLOW : ratios exacts, départage par Q12 puis Q11, puis ordre stable. */
		function scoreProfile(answers) {
			for (var q = 0; q < SCORING.length; q++) if (answers[q] == null) return null;
			var max = [0, 0, 0, 0];
			var scores = [0, 0, 0, 0];
			for (var i = 0; i < SCORING.length; i++) {
				for (var k = 0; k < 4; k++) {
					max[k] += Math.max.apply(null, SCORING[i].map(function (p) { return p[k]; }));
					scores[k] += SCORING[i][answers[i]][k];
				}
			}
			var order = [0, 1, 2, 3].sort(function (a, b) {
				var diff = scores[b] * max[a] - scores[a] * max[b];
				if (diff !== 0) return diff;
				var tieBreak = [11, 10];
				for (var t = 0; t < tieBreak.length; t++) {
					var points = SCORING[tieBreak[t]][answers[tieBreak[t]]];
					if (points[b] !== points[a]) return points[b] - points[a];
				}
				return a - b;
			});
			return PROFILE_KEYS[order[0]];
		}

		/**
		 * Rassemble profil, réponses et coordonnées.
		 * Profil : résultat enregistré par le quiz, puis ?reflow_profil= (ou ?profil=), puis barème.
		 * Réponses : URL (q1…q12), puis résultat enregistré, puis brouillon du quiz.
		 */
		function readInput(search, stored) {
			var params = new URLSearchParams(search || '');
			stored = stored || {};
			var result = storedAnswers(stored.result);
			var draft = storedAnswers(stored.draft);
			var answers = [];
			for (var q = 0; q < QUESTION_IDS.length; q++) {
				var fromUrl = parseAnswer(q, params.get('q' + (q + 1)) || params.get('Q' + (q + 1)));
				answers.push(fromUrl != null ? fromUrl : result.answers[q] != null ? result.answers[q] : draft.answers[q]);
			}
			var savedProfile = result.data && result.data.v === 1 ? parseProfile(result.data.profile) : null;
			var profile =
				savedProfile ||
				parseProfile(params.get('reflow_profil')) ||
				parseProfile(params.get('profil')) ||
				scoreProfile(answers);
			var get = function (key) { return clean(params.get(key)); };
			return {
				profile: profile,
				answers: answers,
				lead: { first_name: get('first_name'), last_name: get('last_name'), email: get('email'), phone: get('phone') },
			};
		}

		function attentionPoints(profileKey, answers) {
			var profile = PROFILES[profileKey];
			if (!profile) return [];
			return profile.attention
				.filter(function (rule) {
					var index = answers[rule.q - 1];
					return index != null && rule.when.indexOf('ABCD'.charAt(index)) !== -1;
				})
				.map(function (rule) { return rule.text; });
		}

		/* ------------------------------------------------------------------ */
		/* Rendu                                                              */
		/* ------------------------------------------------------------------ */
		/* Typographie française : espace fine insécable avant ; ! ? et insécable avant : */
		function fr(text) {
			return String(text)
				.replace(/ ([;!?])/g, ' $1')
				.replace(/ :/g, ' :')
				.replace(/« /g, '« ')
				.replace(/ »/g, ' »');
		}

		function esc(text) {
			return fr(text)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;');
		}

		function kicker(num, label) {
			return '<p class="rf-kicker"><b>' + num + '</b>' + esc(label) + '</p>';
		}

		/* Icônes (traits, couleur héritée). */
		var ICONS = {
			target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
			alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>',
			pilates: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2"/><path d="M4 21c2-4 4-6 8-6s6 2 8 6"/><path d="M6 11c2 1.5 4 2 6 2s4-.5 6-2"/><path d="M12 7v6"/></svg>',
			force: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M3 9v6"/><path d="M21 9v6"/><path d="M6.5 12h11"/></svg>',
			yoga: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20c-4 0-8-2.5-8-6 2.5 0 5 1 8 4 3-3 5.5-4 8-4 0 3.5-4 6-8 6Z"/><path d="M12 18c-2-2.5-2.5-6 0-11 2.5 5 2 8.5 0 11Z"/></svg>',
			check: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
		};
		var SESSION_ICONS = ['pilates', 'force', 'yoga'];

		function renderParas(paras) {
			return paras
				.map(function (p) {
					if (typeof p === 'string') return '<p>' + esc(p) + '</p>';
					if (p.key) return '<p class="rf-key">' + esc(p.key) + '</p>';
					if (p.cycle) {
						return (
							'<ol class="rf-cycle" aria-label="Le cercle du tout ou rien">' +
							p.cycle.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') +
							'</ol>'
						);
					}
					return '';
				})
				.join('');
		}

		/* En-tête de bloc : « Bloc 01 », titre avec un mot mis en valeur, sous-titre. */
		function blockHead(num, before, accent, sub, id) {
			return (
				'<div class="rf-block-head"><p class="rf-eyebrow">Bloc ' + num + '</p>' +
				'<h2 id="' + id + '">' + esc(before) + ' <span class="rf-accent">' + esc(accent) + '</span></h2>' +
				(sub ? '<p>' + esc(sub) + '</p>' : '') +
				'</div>'
			);
		}

		function renderHomeLink() {
			return '<p class="rf-home"><a href="' + esc(HOME_URL) + '">' + esc('Revenir à l’accueil') + '</a></p>';
		}

		function renderCta() {
			return (
				'<section class="rf-cta" aria-labelledby="rf-cta-title" data-rf-booking>' +
				'<p class="rf-eyebrow">' + esc(CTA.title) + '</p>' +
				'<h2 id="rf-cta-title">30 minutes <span class="rf-accent">' + esc('pour analyser tes résultats') + '</span></h2>' +
				'<p class="rf-cta-intro">' + esc(CTA.intro) + '</p>' +
				'<ul class="rf-checks">' + CTA.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' +
				'<a class="rf-button" href="#rf-booking" data-rf-booking-link>' + esc(CTA.button) + '</a>' +
				'<div class="rf-booking" id="rf-booking"><slot name="calendar"></slot></div>' +
				'</section>' +
				'<p class="rf-disclaimer">' +
				esc('Ce questionnaire est un outil d’orientation et de réflexion. Il ne constitue pas une évaluation médicale et ne remplace pas l’avis d’un professionnel de santé.') +
				'</p>' + renderHomeLink()
			);
		}

		function renderProfile(key, answers, lead) {
			var p = PROFILES[key];
			var points = attentionPoints(key, answers);

			var attention = points.length
				? '<aside class="rf-alert">' + ICONS.alert + '<div><h3>' +
					(points.length > 1 ? 'Tes points d’attention' : 'Ton point d’attention') +
					'</h3><ul>' + points.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div></aside>'
				: '';

			var steps = p.priority.steps.length
				? '<ol class="rf-steps">' +
					p.priority.steps
						.map(function (s, i) {
							return (
								'<li class="rf-step"><span class="rf-step-num" aria-hidden="true">' + (i + 1) + '</span>' +
								'<h3>' + esc(s[0]) + '</h3>' + (s[1] ? '<p>' + esc(s[1]) + '</p>' : '') + '</li>'
							);
						})
						.join('') +
					'</ol>'
				: '';

			var months = p.plan.months
				.map(function (m, i) {
					return (
						'<li class="rf-month"><div class="rf-month-top">' +
						'<span class="rf-month-num"><small>Mois</small><b>' + (i + 1) + '</b></span>' +
						'<h3>' + esc(MONTH_TITLES[i]) + '</h3></div>' +
						'<p>' + esc(m.intro) + '</p>' +
						'<ul class="rf-list">' + m.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
						'<div class="rf-benefit"><p><span>' + ICONS.check + 'Ton bénéfice au quotidien</span>' + esc(m.benefit) + '</p></div></li>'
					);
				})
				.join('');

			var sessions = p.week.sessions
				.map(function (text, i) {
					return (
						'<li class="rf-session"><span class="rf-session-icon">' + ICONS[SESSION_ICONS[i]] + '</span>' +
						'<p class="rf-eyebrow">Séance ' + (i + 1) + '</p>' +
						'<h3>' + esc(SESSION_NAMES[i]) + '</h3>' +
						'<span class="rf-session-time">30 min</span>' +
						'<p>' + esc(text) + '</p></li>'
					);
				})
				.join('');

			var heading = lead.first_name
				? esc('Ton plan de progression,') + '<span class="rf-accent">' + esc(lead.first_name) + '</span>'
				: esc('Ton plan de progression') + '<span class="rf-accent">' + esc('Profil ' + p.label) + '</span>';

			return (
				'<div class="rf-wrap">' +
				'<p class="rf-brand">RE-FLOW</p>' +

				'<header class="rf-hero">' +
				'<p class="rf-eyebrow">' + ICONS.target + esc(lead.first_name ? 'Profil ' + p.label : 'Résultats de ton auto-évaluation') + '</p>' +
				'<h1 tabindex="-1">' + heading + '</h1>' +
				'<p class="rf-lead">' + esc(p.title) + '</p>' +
				'<p class="rf-pill">' + esc('Objectif : ' + p.goal) + '</p>' +
				'</header>' +

				'<section class="rf-block" aria-labelledby="rf-b1">' +
				blockHead('01', 'Ton bilan', 'physique', 'Ce que montrent tes réponses aujourd’hui', 'rf-b1') +
				'<div class="rf-highlight"><p class="rf-statement">' + esc(p.bilan.title) + '</p></div>' +
				'<div class="rf-prose">' + renderParas(p.bilan.paras) + '</div>' +
				'</section>' +

				'<section class="rf-block" aria-labelledby="rf-b2">' +
				blockHead('02', 'Ta', 'priorité', 'Là où concentrer ton énergie en premier', 'rf-b2') +
				'<div class="rf-highlight"><p class="rf-statement">' + esc(p.priority.title) + '</p></div>' +
				'<div class="rf-prose">' + renderParas(p.priority.paras) + '</div>' +
				steps + attention +
				'</section>' +

				'<section class="rf-block" aria-labelledby="rf-b3">' +
				blockHead('03', 'Ton plan', 'd’action', 'Une progression en 4 étapes, à ton rythme', 'rf-b3') +
				'<div class="rf-highlight"><p class="rf-big">4 MOIS</p><p>' + esc(p.plan.sub) + '</p></div>' +
				'<ol class="rf-months">' + months + '</ol>' +
				'</section>' +

				'<section class="rf-block" aria-labelledby="rf-b4">' +
				blockHead('04', 'Ta semaine', 'type', 'Ce dont ton corps a besoin pour suivre ce plan', 'rf-b4') +
				'<div class="rf-highlight"><p class="rf-big">3 × 30 MIN</p><p>' +
				esc('par semaine. Pas plus ! Des séances modulables qui s’adaptent ' + p.week.fit + '.') +
				'</p></div>' +
				'<ol class="rf-sessions">' + sessions + '</ol>' +
				'<p class="rf-note">' + esc('Ce rythme est un repère général. Le dosage exact (exercices, progressions, ajustements à ton corps), c’est ce qu’on définit ensemble lors de l’appel bilan.') + '</p>' +
				'</section>' +

				renderCta() +
				'</div>'
			);
		}

		/* Même message qu’avant quand aucun résultat n’est retrouvé. */
		function renderMissing() {
			return (
				'<div class="rf-wrap rf-missing"><p class="rf-brand">RE-FLOW</p>' +
				'<header class="rf-hero">' +
				'<h1>' + esc('Ton résultat n’est pas disponible ici') + '</h1>' +
				'<p class="rf-lead">' + esc('Il a été envoyé par e-mail. Tu peux aussi refaire le quiz : il ne prend que 2 minutes.') + '</p>' +
				'<a class="rf-button" href="' + esc(QUIZ_URL) + '">Refaire le quiz</a>' +
				renderHomeLink() +
				'</header></div>'
			);
		}

		/* API exposée pour les tests et le débogage dans la console. */
		window.ReflowResultat = {
			readInput: readInput,
			attentionPoints: attentionPoints,
			scoreProfile: scoreProfile,
			parseAnswer: parseAnswer,
			parseProfile: parseProfile,
			PROFILES: PROFILES,
		};

		/* ------------------------------------------------------------------ */
		/* Page                                                               */
		/* ------------------------------------------------------------------ */
		var host = document.getElementById('reflow-resultat');
		if (!host || host.shadowRoot) return;

		function trackUmami(name) {
			if (window.umami && typeof window.umami.track === 'function') window.umami.track(name);
		}
		function trackMeta(event, params, custom) {
			if (typeof window.fbq !== 'function') return;
			window.fbq(custom ? 'trackCustom' : 'track', event, params);
		}
		function storageGet(key) {
			try {
				return localStorage.getItem(key);
			} catch (e) {
				return null;
			}
		}
		function storageRemove(key) {
			try {
				localStorage.removeItem(key);
			} catch (e) {}
		}

		// Les polices sont déclarées dans la page : le shadow DOM les utilise ensuite.
		if (!document.querySelector('link[data-reflow-fonts]')) {
			var fonts = document.createElement('link');
			fonts.rel = 'stylesheet';
			fonts.href = 'https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Montserrat:wght@500;600&display=swap';
			fonts.setAttribute('data-reflow-fonts', '');
			document.head.appendChild(fonts);
		}

		// Le brouillon contient les réponses : on le lit avant de l’effacer.
		var input = readInput(window.location.search, {
			result: storageGet(RESULT_KEY),
			draft: storageGet(DRAFT_KEY),
		});
		var shadow = host.attachShadow({ mode: 'open' });
		shadow.innerHTML =
			'<style>' + CSS + '</style><div class="rf" data-profil="' + (input.profile || 'inconnu') + '">' +
			(input.profile ? renderProfile(input.profile, input.answers, input.lead) : renderMissing()) +
			'</div>';
		if (!input.profile) return;

		// Le quiz est terminé : la prochaine visite repart d’un questionnaire vierge.
		storageRemove(DRAFT_KEY);
		trackUmami('lead_submitted');

		var booking = shadow.querySelector('[data-rf-booking]');
		// L’iframe reste dans la page (slot) : form_embed.js de GHL la retrouve pour ajuster sa hauteur.
		function mountCalendar() {
			if (host.querySelector('iframe')) return;
			var bookingUrl = new URL('https://api.leadconnectorhq.com/widget/booking/' + CALENDAR_ID);
			['first_name', 'last_name', 'email', 'phone'].forEach(function (key) {
				if (input.lead[key]) bookingUrl.searchParams.set(key, input.lead[key]);
			});
			var iframe = document.createElement('iframe');
			iframe.id = CALENDAR_ID + '_reflow';
			iframe.src = bookingUrl.toString();
			iframe.title = 'Réserver mon appel bilan offert';
			iframe.allow = 'payment';
			iframe.setAttribute('scrolling', 'no');
			iframe.style.cssText = 'display:block;width:100%;border:none;overflow:hidden;min-height:600px';
			iframe.slot = 'calendar';
			host.appendChild(iframe);
			if (!document.querySelector('script[data-reflow-booking-embed]')) {
				var embed = document.createElement('script');
				embed.src = 'https://link.msgsndr.com/js/form_embed.js';
				embed.async = true;
				embed.setAttribute('data-reflow-booking-embed', '');
				document.body.appendChild(embed);
			}
		}

		var bookingViewed = false;
		function trackBookingViewed() {
			if (bookingViewed) return;
			bookingViewed = true;
			trackUmami('booking_viewed');
			trackMeta('BookingViewed', QUIZ_CONTENT, true);
		}

		var link = shadow.querySelector('[data-rf-booking-link]');
		if (link) {
			link.addEventListener('click', function (event) {
				event.preventDefault();
				mountCalendar();
				booking.querySelector('.rf-booking').scrollIntoView({ behavior: 'smooth', block: 'start' });
			});
		}

		if (typeof IntersectionObserver === 'undefined') {
			mountCalendar();
			trackBookingViewed();
		} else {
			var mountObserver = new IntersectionObserver(
				function (entries) {
					if (!entries.some(function (e) { return e.isIntersecting; })) return;
					mountCalendar();
					mountObserver.disconnect();
				},
				{ rootMargin: '600px 0px' },
			);
			mountObserver.observe(booking);
			var viewObserver = new IntersectionObserver(
				function (entries) {
					if (!entries.some(function (e) { return e.isIntersecting && e.intersectionRatio > 0; })) return;
					trackBookingViewed();
					viewObserver.disconnect();
				},
				{ threshold: 0.4 },
			);
			viewObserver.observe(booking);
		}

	})();
</script>
